<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Conejos Sari-Sari Store — Price Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#0F3D2E;
    --green-700:#1B5E42;
    --green-600:#237A54;
    --green-100:#E5F3EC;
    --orange-500:#F97316;
    --orange-600:#EA5E0A;
    --orange-100:#FFE9D6;
    --paper:#FFFFFF;
    --bg:#FAFAF8;
    --ink:#14201B;
    --ink-soft:#5A6B63;
    --line:#E7EDE9;
    --radius:18px;
    --shadow: 0 1px 2px rgba(15,61,46,.06), 0 8px 24px rgba(15,61,46,.08);
    --font-display:'Fredoka', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html.dark{
    --paper:#122019;
    --bg:#0C1712;
    --ink:#EFF5F1;
    --ink-soft:#9FB4A9;
    --line:#1E3128;
    --green-100:#173226;
    --orange-100:#3A2412;
  }
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:var(--font-display);}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  .app{min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;text-decoration:none;}

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding: 12px 16px;
    display:flex;align-items:center;gap:10px;
  }
  .topbar .back{
    width:40px;height:40px;border-radius:12px;border:none;background:var(--green-100);
    color:var(--green-900);display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-size:18px;
  }
  html.dark .topbar .back{color:#BFE8D2;}
  .topbar .title-wrap{flex:1;min-width:0;}
  .topbar .page-title{font-size:17px;font-weight:600;margin:0;line-height:1.2;}
  .topbar .page-sub{font-size:12px;color:var(--ink-soft);margin:0;}
  .mode-pill{
    font-size:11px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:999px;
    text-transform:uppercase;
  }
  .mode-pill.retail{background:var(--green-100);color:var(--green-900);}
  html.dark .mode-pill.retail{color:#BFE8D2;}
  .mode-pill.wholesale{background:var(--orange-100);color:var(--orange-600);}
  .dark-toggle{
    width:40px;height:40px;border-radius:12px;border:none;background:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
    border:1px solid var(--line);
  }

  main{flex:1;width:100%;max-width:960px;margin:0 auto;padding:16px;padding-bottom:100px;}

  /* HOME */
  .home-wrap{
    min-height:calc(100vh - 0px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px 20px;gap:6px;
  }
  .logo-badge{
    font-size:56px;line-height:1;margin-bottom:6px;
  }
  .home-title{font-size:30px;margin:0;color:var(--green-900);font-weight:700;}
  html.dark .home-title{color:#EFF5F1;}
  .home-sub{font-size:15px;color:var(--ink-soft);margin:2px 0 34px;font-weight:500;}
  .home-buttons{display:flex;flex-direction:column;gap:16px;width:100%;max-width:340px;}
  .home-btn{
    display:flex;align-items:center;gap:14px;
    padding:22px 24px;border-radius:20px;border:none;
    font-size:19px;font-weight:600;font-family:var(--font-display);
    box-shadow:var(--shadow);
    transition:transform .12s ease;
  }
  .home-btn:active{transform:scale(.97);}
  .home-btn .emoji{font-size:26px;}
  .home-btn.retail{background:var(--green-700);color:#fff;}
  .home-btn.wholesale{background:var(--orange-500);color:#fff;}
  .home-btn .sub{display:block;font-family:var(--font-body);font-weight:400;font-size:12.5px;opacity:.85;margin-top:1px;}
  .home-foot{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink-soft);}

  /* Search */
  .search-wrap{position:relative;margin-bottom:16px;}
  .search-wrap input{
    width:100%;padding:14px 16px 14px 44px;border-radius:16px;border:1.5px solid var(--line);
    background:var(--paper);font-size:15px;color:var(--ink);outline:none;
  }
  .search-wrap input:focus{border-color:var(--green-600);}
  .search-wrap .icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--ink-soft);}
  .search-wrap .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:var(--bg);width:26px;height:26px;border-radius:50%;font-size:13px;color:var(--ink-soft);display:none;align-items:center;justify-content:center;}

  /* Category grid */
  .section-label{font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:20px 2px 10px;}
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(min-width:520px){.cat-grid{grid-template-columns:repeat(4,1fr);}}
  @media(min-width:760px){.cat-grid{grid-template-columns:repeat(5,1fr);}}
  .cat-card{
    background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 8px;
    display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
    box-shadow:var(--shadow);
  }
  .cat-card .emoji{font-size:24px;}
  .cat-card .name{font-size:12.5px;font-weight:600;line-height:1.2;}
  .cat-card .count{font-size:10.5px;color:var(--ink-soft);}
  .cat-card:active{transform:scale(.97);}

  /* Product grid */
  .prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(min-width:560px){.prod-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:820px){.prod-grid{grid-template-columns:repeat(4,1fr);}}
  .prod-card{
    background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:108px;
  }
  .prod-card .pimg{width:100%;height:60px;border-radius:10px;background:var(--green-100);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:2px;}
  .prod-card .pname{font-size:13.5px;font-weight:600;line-height:1.25;}
  .prod-card .punit{font-size:10.5px;color:var(--ink-soft);}
  .prod-card .prow{display:flex;align-items:baseline;justify-content:space-between;margin-top:auto;}
  .prod-card .price{font-family:var(--font-display);font-weight:600;font-size:17px;}
  .prod-card.retail .price{color:var(--green-700);}
  html.dark .prod-card.retail .price{color:#4FD08C;}
  .prod-card.wholesale .price{color:var(--orange-600);}
  .stock-dot{width:8px;height:8px;border-radius:50%;background:#2FAE60;flex-shrink:0;}
  .stock-dot.out{background:#D64545;}
  .stock-row{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--ink-soft);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state .emoji{font-size:38px;display:block;margin-bottom:10px;}

  .cat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cat-header h2{margin:0;font-size:19px;}
  .cat-header .back-link{font-size:13px;font-weight:600;color:var(--green-700);border:none;background:none;padding:6px 10px;border-radius:10px;}
  html.dark .cat-header .back-link{color:#4FD08C;}

  /* Recently viewed */
  .rv-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
  .rv-chip{
    flex-shrink:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;
    padding:10px 14px;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;gap:2px;min-width:120px;
  }
  .rv-chip .p{font-weight:700;font-size:13px;}
  .rv-chip .p.retail{color:var(--green-700);}
  html.dark .rv-chip .p.retail{color:#4FD08C;}
  .rv-chip .p.wholesale{color:var(--orange-600);}

  /* Floating AI button */
  .fab{
    position:fixed;bottom:22px;right:18px;z-index:50;
    width:58px;height:58px;border-radius:50%;background:var(--orange-500);color:#fff;
    border:none;box-shadow:0 6px 20px rgba(234,94,10,.4);font-size:24px;
    display:flex;align-items:center;justify-content:center;
  }
  .fab:active{transform:scale(.94);}

  /* Chat panel */
  .chat-overlay{
    position:fixed;inset:0;background:rgba(15,25,20,.4);z-index:60;
    display:none;align-items:flex-end;justify-content:center;
  }
  .chat-overlay.open{display:flex;}
  @media(min-width:560px){.chat-overlay{align-items:center;}}
  .chat-panel{
    background:var(--paper);width:100%;max-width:420px;height:78vh;max-height:640px;
    border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 -10px 40px rgba(0,0,0,.2);
  }
  @media(min-width:560px){.chat-panel{border-radius:22px;height:70vh;}}
  .chat-head{
    background:var(--green-700);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
  }
  .chat-head .t{font-family:var(--font-display);font-weight:600;font-size:16px;}
  .chat-head .sub{font-size:11px;opacity:.85;}
  .chat-head button{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:14px;}
  .chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg);}
  .msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;}
  .msg.bot{background:var(--paper);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.user{background:var(--green-700);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--paper);}
  .chat-input-row input{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14px;background:var(--bg);color:var(--ink);outline:none;}
  .chat-input-row input:focus{border-color:var(--green-600);}
  .chat-input-row button{border:none;background:var(--orange-500);color:#fff;width:42px;height:42px;border-radius:12px;font-size:16px;flex-shrink:0;}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px;}
  .chip{font-size:11.5px;background:var(--green-100);color:var(--green-900);border:none;padding:6px 11px;border-radius:999px;font-weight:600;}
  html.dark .chip{color:#BFE8D2;}

  /* Admin */
  .admin-gate{max-width:340px;margin:80px auto;text-align:center;}
  .admin-gate input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);margin:14px 0;font-size:15px;background:var(--paper);color:var(--ink);}
  .btn-primary{background:var(--green-700);color:#fff;border:none;padding:13px 20px;border-radius:12px;font-weight:600;font-size:14px;width:100%;}
  .admin-toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .btn-secondary{background:var(--green-100);color:var(--green-900);border:none;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;}
  html.dark .btn-secondary{color:#BFE8D2;}
  .admin-table{width:100%;border-collapse:collapse;font-size:13px;}
  .admin-table th{text-align:left;padding:8px 6px;color:var(--ink-soft);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--line);}
  .admin-table td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .admin-table input,.admin-table select{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;background:var(--paper);color:var(--ink);}
  .admin-table .del-btn{background:#FBE7E7;color:#C0392B;border:none;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;}
  .admin-row-new{background:var(--green-100);}
  .save-note{font-size:12px;color:var(--green-700);font-weight:600;height:16px;}
  html.dark .save-note{color:#4FD08C;}

  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
</style>
</head>
<body>
<div id="root" class="app"></div>

<button class="fab" id="fabBtn" title="Ask the assistant">💬</button>
<div class="chat-overlay" id="chatOverlay">
  <div class="chat-panel">
    <div class="chat-head">
      <div>
        <div class="t">🤖 Store Assistant</div>
        <div class="sub" id="chatModeLabel">Checking retail prices</div>
      </div>
      <button id="chatClose">✕</button>
    </div>
    <div class="chip-row">
      <button class="chip" data-q="show all shampoo">show all shampoo</button>
      <button class="chip" data-q="show all tuna">show all tuna</button>
      <button class="chip" data-q="cheapest sardines">cheapest sardines</button>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="Ask about a product...">
      <button id="chatSend">➤</button>
    </div>
  </div>
</div>

}
function saveProducts(){
  window.storage.set('store-products', JSON.stringify(state.products), true).catch(function(){});
}
function saveRecent(){
  window.storage.set('recently-viewed', JSON.stringify(state.recentlyViewed), false).catch(function(){});
}
function saveDark(){
  window.storage.set('dark-mode', state.dark ? "1":"0", false).catch(function(){});
}

/* ---------- utils ---------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function peso(n){
  if(n===null || n===undefined || n==="") return "—";
  var num = parseFloat(n);
  if(isNaN(num)) return "—";
  return "₱" + (num % 1 === 0 ? num.toFixed(0) : num.toFixed(2));
}
function priceFor(p, mode){
  return mode === "wholesale" ? p.wholesale : p.retail;
}
function categoryEmoji(cat){ return CATEGORY_META[cat] || "🛍️"; }

function searchProducts(query, mode){
  var q = query.trim().toLowerCase();
  if(!q) return [];
  return state.products.filter(function(p){
    if(mode === "wholesale" && (p.wholesale===null || p.wholesale===undefined)) return false;
    return p.name.toLowerCase().indexOf(q) !== -1;
  });
}
function productsInCategory(cat, mode){
  return state.products.filter(function(p){
    if(p.category !== cat) return false;
    if(mode === "wholesale" && (p.wholesale===null || p.wholesale===undefined)) return false;
    return true;
  });
}
function addRecent(p){
  state.recentlyViewed = state.recentlyViewed.filter(function(id){ return id !== p.id; });
  state.recentlyViewed.unshift(p.id);
  state.recentlyViewed = state.recentlyViewed.slice(0,10);
  saveRecent();
}

/* ---------- rendering ---------- */
var root = document.getElementById('root');

function render(){
  var html = "";
  if(state.route === "home"){
    html = renderHome();
  } else if(state.route === "retail" || state.route === "wholesale"){
    html = renderTopbar() + '<main>' + renderBrowsePage() + '</main>';
  } else if(state.route === "category"){
    html = renderTopbar() + '<main>' + renderCategoryPage() + '</main>';
  } else if(state.route === "admin"){
    html = renderTopbar() + '<main>' + renderAdminPage() + '</main>';
  }
  root.innerHTML = html;
  attachEvents();
  document.getElementById('fabBtn').style.display = (state.route === "admin" || state.route === "home") ? "none" : "flex";
  if(state.route === "home") document.getElementById('fabBtn').style.display = "none";
}

function renderTopbar(){
  var title, sub, showModePill = false;
  if(state.route === "retail" || state.route === "wholesale"){
    title = state.route === "retail" ? "Retail Price List" : "Wholesale Price List";
    sub = "Tap a category or search";
  } else if(state.route === "category"){
    title = state.category;
    sub = (state.mode === "retail" ? "Retail" : "Wholesale") + " prices";
  } else if(state.route === "admin"){
    title = "Admin — Manage Products";
    sub = "Add, edit, or remove items";
  }
  return '<div class="topbar">' +
    '<button class="back" id="backBtn">←</button>' +
    '<div class="title-wrap"><p class="page-title">'+esc(title)+'</p><p class="page-sub">'+esc(sub)+'</p></div>' +
    (state.route !== "admin" ? '<span class="mode-pill '+state.mode+'">'+state.mode+'</span>' : '') +
    '<button class="dark-toggle" id="darkBtn">'+(state.dark?'☀️':'🌙')+'</button>' +
    '</div>';
}

function renderHome(){
  return '<div class="home-wrap">' +
    '<div class="logo-badge">🏪</div>' +
    '<h1 class="home-title">Conejos Sari-Sari Store</h1>' +
    '<p class="home-sub">Price Checker</p>' +
    '<div class="home-buttons">' +
      '<button class="home-btn retail" data-go="retail"><span class="emoji">🛒</span><span><span class="display">Retail</span><span class="sub">Prices for walk-in customers</span></span></button>' +
      '<button class="home-btn wholesale" data-go="wholesale"><span class="emoji">📦</span><span><span class="display">Wholesale</span><span class="sub">Bulk / suki prices</span></span></button>' +
    '</div>' +
    '</div>' +
    '<div class="home-foot"><a href="#" id="adminLink" style="color:inherit;">Admin</a></div>';
}

function renderBrowsePage(){
  var out = "";
  out += renderSearchBar();
  var q = state.search.trim();
  if(q){
    var results = searchProducts(q, state.mode);
    out += '<p class="section-label">Search results ('+results.length+')</p>';
    out += renderProductGrid(results);
    return out;
  }
  out += renderRecentlyViewed();
  out += '<p class="section-label">Categories</p>';
  out += '<div class="cat-grid">';
  CATEGORY_ORDER.forEach(function(cat){
    var count = productsInCategory(cat, state.mode).length;
    out += '<button class="cat-card" data-cat="'+esc(cat)+'">' +
      '<span class="emoji">'+categoryEmoji(cat)+'</span>' +
      '<span class="name">'+esc(cat)+'</span>' +
      '<span class="count">'+count+' items</span>' +
      '</button>';
  });
  out += '</div>';
  return out;
}

function renderSearchBar(){
  return '<div class="search-wrap">' +
    '<span class="icon">🔍</span>' +
    '<input id="searchInput" type="text" placeholder="Search '+state.mode+' products..." value="'+esc(state.search)+'">' +
    '<button class="clear" id="clearSearch" style="display:'+(state.search?'flex':'none')+'">✕</button>' +
    '</div>';
}

function renderRecentlyViewed(){
  if(!state.recentlyViewed.length) return "";
  var items = state.recentlyViewed.map(function(id){
    return state.products.find(function(p){ return p.id === id; });
  }).filter(Boolean);
  if(!items.length) return "";
  var out = '<p class="section-label">Recently Viewed</p><div class="rv-row">';
  items.forEach(function(p){
    var price = priceFor(p, state.mode);
    out += '<div class="rv-chip" data-viewid="'+p.id+'"><span>'+esc(p.name)+'</span><span class="p '+state.mode+'">'+peso(price)+'</span></div>';
  });
  out += '</div>';
  return out;
}

function renderCategoryPage(){
  var out = "";
  out += renderSearchBar();
  var q = state.search.trim();
  var list;
  if(q){
    list = searchProducts(q, state.mode).filter(function(p){ return p.category === state.category; });
  } else {
    list = productsInCategory(state.category, state.mode);
  }
  out += '<div class="cat-header"><h2>'+categoryEmoji(state.category)+' '+esc(state.category)+'</h2>' +
    '<button class="back-link" data-go="'+state.mode+'">All categories</button></div>';
  out += renderProductGrid(list);
  return out;
}

function renderProductGrid(list){
  if(!list.length){
    return '<div class="empty-state"><span class="emoji">🔎</span>No matching products found.</div>';
  }
  var out = '<div class="prod-grid">';
  list.forEach(function(p){
    var price = priceFor(p, state.mode);
    var out_of = p.stock === "Out of Stock";
    out += '<div class="prod-card '+state.mode+'" data-viewid="'+p.id+'">' +
      '<div class="pimg">'+categoryEmoji(p.category)+'</div>' +
      '<div class="pname">'+esc(p.name)+'</div>' +
      (p.unit ? '<div class="punit">'+esc(p.unit)+'</div>' : '') +
      '<div class="stock-row"><span class="stock-dot'+(out_of?' out':'')+'"></span>'+(out_of?'Out of stock':'In stock')+'</div>' +
      '<div class="prow"><span class="price">'+peso(price)+'</span></div>' +
      '</div>';
  });
  out += '</div>';
  return out;
}

/* ---------- Admin ---------- */
function renderAdminPage(){
  if(!state.adminUnlocked){
    return '<div class="admin-gate">' +
      '<h2>🔒 Admin Access</h2>' +
      '<p style="color:var(--ink-soft);font-size:13px;">Enter the admin password to manage products.</p>' +
      '<input id="adminPass" type="password" placeholder="Password">' +
      '<div id="adminError" style="color:#C0392B;font-size:12px;height:16px;"></div>' +
      '<button class="btn-primary" id="adminUnlockBtn">Unlock</button>' +
      '</div>';
  }
  var out = '<div class="admin-toolbar">' +
    '<button class="btn-secondary" id="addProductBtn">+ Add Product</button>' +
    '<button class="btn-secondary" id="exportBtn">Export data</button>' +
    '<span class="save-note" id="saveNote"></span>' +
    '</div>';
  out += '<div style="overflow-x:auto;"><table class="admin-table"><thead><tr>' +
    '<th>Name</th><th>Category</th><th>Retail</th><th>Wholesale</th><th>Unit</th><th>Stock</th><th></th>' +
    '</tr></thead><tbody id="adminTbody">';
  state.products.forEach(function(p){
    out += adminRow(p);
  });
  out += '</tbody></table></div>';
  return out;
}
function adminRow(p){
  var opts = CATEGORY_ORDER.map(function(c){
    return '<option value="'+esc(c)+'"'+(c===p.category?' selected':'')+'>'+esc(c)+'</option>';
  }).join('');
  return '<tr data-id="'+p.id+'">' +
    '<td><input class="f-name" value="'+esc(p.name)+'"></td>' +
    '<td><select class="f-cat">'+opts+'</select></td>' +
    '<td><input class="f-retail" type="number" step="0.01" value="'+(p.retail===null||p.retail===undefined?'':p.retail)+'"></td>' +
    '<td><input class="f-wholesale" type="number" step="0.01" value="'+(p.wholesale===null||p.wholesale===undefined?'':p.wholesale)+'"></td>' +
    '<td><input class="f-unit" value="'+esc(p.unit||'')+'"></td>' +
    '<td><select class="f-stock"><option value="In Stock"'+(p.stock!=='Out of Stock'?' selected':'')+'>In Stock</option><option value="Out of Stock"'+(p.stock==='Out of Stock'?' selected':'')+'>Out</option></select></td>' +
    '<td><button class="del-btn" data-del="'+p.id+'">Delete</button></td>' +
    '</tr>';
}

/* ---------- events ---------- */
function attachEvents(){
  var backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', function(){
    if(state.route === 'category'){ state.route = state.mode; state.search=""; }
    else if(state.route === 'admin'){ state.route = 'home'; }
    else { state.route = 'home'; state.search=""; }
    render();
  });
  var darkBtn = document.getElementById('darkBtn');
  if(darkBtn) darkBtn.addEventListener('click', function(){
    state.dark = !state.dark;
    document.documentElement.classList.toggle('dark', state.dark);
    saveDark();
    render();
  });
  document.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click', function(){
      var go = el.getAttribute('data-go');
      state.mode = go;
      state.route = go;
      state.search = "";
      render();
    });
  });
  var adminLink = document.getElementById('adminLink');
  if(adminLink) adminLink.addEventListener('click', function(e){
    e.preventDefault();
    state.route = 'admin';
    render();
  });
  document.querySelectorAll('[data-cat]').forEach(function(el){
    el.addEventListener('click', function(){
      state.category = el.getAttribute('data-cat');
      state.route = 'category';
      state.search = "";
      render();
    });
  });
  var searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', function(){
      state.search = searchInput.value;
      render();
      var el = document.getElementById('searchInput');
      if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
    });
  }
  var clearSearch = document.getElementById('clearSearch');
  if(clearSearch) clearSearch.addEventListener('click', function(){
    state.search = "";
    render();
  });
  document.querySelectorAll('[data-viewid]').forEach(function(el){
    el.addEventListener('click', function(){
      var p = state.products.find(function(x){ return x.id === el.getAttribute('data-viewid'); });
      if(p) addRecent(p);
    });
  });

  /* Admin */
  var unlockBtn = document.getElementById('adminUnlockBtn');
  if(unlockBtn){
    var doUnlock = function(){
      var val = document.getElementById('adminPass').value;
      if(val === ADMIN_PASSWORD){ state.adminUnlocked = true; render(); }
      else { document.getElementById('adminError').textContent = "Incorrect password."; }
    };
    unlockBtn.addEventListener('click', doUnlock);
    document.getElementById('adminPass').addEventListener('keydown', function(e){
      if(e.key === 'Enter') doUnlock();
    });
  }
  var addBtn = document.getElementById('addProductBtn');
  if(addBtn) addBtn.addEventListener('click', function(){
    var newP = {id:'p'+Date.now(), name:"New Product", category:CATEGORY_ORDER[0], retail:0, wholesale:null, unit:"", stock:"In Stock"};
    state.products.unshift(newP);
    render();
    flashSave();
  });
  var exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(state.products,null,2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'store-products.json';
    a.click();
  });
  document.querySelectorAll('#adminTbody tr').forEach(function(tr){
    var id = tr.getAttribute('data-id');
    function commit(){
      var p = state.products.find(function(x){ return x.id === id; });
      if(!p) return;
      p.name = tr.querySelector('.f-name').value;
      p.category = tr.querySelector('.f-cat').value;
      var rv = tr.querySelector('.f-retail').value;
      var wv = tr.querySelector('.f-wholesale').value;
      p.retail = rv === "" ? null : parseFloat(rv);
      p.wholesale = wv === "" ? null : parseFloat(wv);
      p.unit = tr.querySelector('.f-unit').value;
      p.stock = tr.querySelector('.f-stock').value;
      saveProducts();
      flashSave();
    }
    tr.querySelectorAll('input,select').forEach(function(inp){
      inp.addEventListener('change', commit);
    });
    var delBtn = tr.querySelector('.del-btn');
    if(delBtn) delBtn.addEventListener('click', function(){
      state.products = state.products.filter(function(x){ return x.id !== id; });
      saveProducts();
      render();
      flashSave();
    });
  });
}
function flashSave(){
  var n = document.getElementById('saveNote');
  if(n){ n.textContent = "Saved ✓"; setTimeout(function(){ if(n) n.textContent=""; }, 1500); }
}

/* ---------- Chat / AI assistant ---------- */
var chatOverlay = document.getElementById('chatOverlay');
var chatBody = document.getElementById('chatBody');
var chatInput = document.getElementById('chatInput');
var chatModeLabel = document.getElementById('chatModeLabel');

document.getElementById('fabBtn').addEventListener('click', function(){
  chatOverlay.classList.add('open');
  chatModeLabel.textContent = "Checking " + (state.mode==='home'?'retail':state.mode) + " prices";
  if(!state.chatHistory.length){
    botSay("Hi! I'm your store assistant. Ask me about any product — e.g. \"ketchup\", \"show all tuna\", or \"cheapest sardines\".");
  }
  chatInput.focus();
});
document.getElementById('chatClose').addEventListener('click', function(){
  chatOverlay.classList.remove('open');
});
chatOverlay.addEventListener('click', function(e){
  if(e.target === chatOverlay) chatOverlay.classList.remove('open');
});
document.getElementById('chatSend').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', function(e){ if(e.key==='Enter') sendChat(); });
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click', function(){
    chatInput.value = c.getAttribute('data-q');
    sendChat();
  });
});

function sendChat(){
  var text = chatInput.value.trim();
  if(!text) return;
  userSay(text);
  chatInput.value = "";
  var reply = answerQuery(text);
  setTimeout(function(){ botSay(reply); }, 200);
}
function userSay(text){
  state.chatHistory.push({who:'user', text:text});
  appendMsg('user', text);
}
function botSay(text){
  state.chatHistory.push({who:'bot', text:text});
  appendMsg('bot', text);
}
function appendMsg(who, text){
  var div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function activeMode(){
  return (state.mode === 'retail' || state.mode === 'wholesale') ? state.mode : 'retail';
}

function answerQuery(text){
  var mode = activeMode();
  var q = text.toLowerCase().trim();
  var priceLabel = mode === 'retail' ? 'Retail Price' : 'Wholesale Price';

  // cheapest X
  var cheapMatch = q.match(/cheapest\s+(.+)/);
  if(cheapMatch){
    var term = cheapMatch[1].replace(/[?.!]/g,'').trim();
    var matches = state.products.filter(function(p){
      return p.name.toLowerCase().indexOf(term) !== -1 && priceFor(p,mode)!==null && priceFor(p,mode)!==undefined;
    });
    if(!matches.length) return "I couldn't find any \"" + term + "\" products.";
    matches.sort(function(a,b){ return priceFor(a,mode) - priceFor(b,mode); });
    var best = matches[0];
    return best.name + "\n\n" + priceLabel + ":\n" + peso(priceFor(best,mode));
  }

  // show all X
  var showMatch = q.match(/show all\s+(.+)|show\s+(.+)|all\s+(.+)/);
  if(/show\s+all|^all\s/.test(q) && showMatch){
    var term2 = (showMatch[1]||showMatch[2]||showMatch[3]||"").replace(/[?.!]/g,'').trim();
    if(term2){
      var m2 = state.products.filter(function(p){ return p.name.toLowerCase().indexOf(term2)!==-1 || p.category.toLowerCase().indexOf(term2)!==-1; });
      if(!m2.length) return "No matching products found.";
      return m2.slice(0,15).map(function(p){ return p.name; }).join("\n");
    }
  }

  // how much is X
  var howMuch = q.match(/how much (?:is|are)\s+(.+)/);
  var term3 = howMuch ? howMuch[1].replace(/[?.!]/g,'').trim() : q.replace(/[?.!]/g,'').trim();

  var direct = state.products.filter(function(p){ return p.name.toLowerCase().indexOf(term3)!==-1; });
  if(direct.length === 1){
    var p = direct[0];
    var price = priceFor(p, mode);
    return p.name + "\n\nPrice:\n" + peso(price);
  }
  if(direct.length > 1){
    if(direct.length <= 6){
      return direct.map(function(pp){ return pp.name + " — " + peso(priceFor(pp,mode)); }).join("\n");
    }
    return "Found " + direct.length + " matches:\n" + direct.slice(0,10).map(function(pp){ return pp.name; }).join("\n") + "\n...try a more specific name.";
  }
  return "I couldn't find \"" + term3 + "\" in the " + mode + " list. Try a shorter or different keyword.";
}

/* ---------- init ---------- */
loadPersisted();
})();

</script>
